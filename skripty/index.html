  <link rel="icon" type="image/png" href="../assets/img/head.png" />

  <title>Blood | Skripty</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<body>
  <a href="../" class="back-btn"><i class="fa-solid fa-arrow-left" style="margin-right: 8px;"></i> Zpět na

  <a href="./tvoric/" class="next-btn"><i class="fa-solid fa-pen-nib" style="margin-right: 8px;"></i> Vytvořit

  <header>
    <div class="header-container">
      <div class="logo-wrapper">
        <h1 style="text-align: center; margin-bottom: 20px">
          Skripty
        </h1>
        <img src="../assets/img/community-logo2.png" alt="Community Logo" class="community-logo" />

    </div>
  </header>

  <main>
    <div class="cards-container" style="justify-content: center; display: flex;">

      <!-- Šedá karta pro vývoj s tlačítkem na tvořič -->
      <div class="portal-card"
        style="background: rgba(255, 255, 255, 0.05); border: 1px dashed rgba(255, 255, 255, 0.2); opacity: 0.85; max-width: 500px; text-align: center; padding: 30px; border-radius: 12px; backdrop-filter: blur(4px);">

        </div>

        <p style="color: #aaa; font-size: 0.95rem; line-height: 1.5; margin-bottom: 20px;">
