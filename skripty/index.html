<!doctype html>
<html lang="cs">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">

  <meta property="og:image" content="https://kinaaj.github.io/blood/assets/img/head.png" />
  <meta property="og:url" content="https://kinaaj.github.io/blood/assets/img/head.png" />

  <link rel="apple-touch-icon" href="../assets/img/head.png" />
  <link rel="icon" type="image/png" href="../assets/img/head.png" />

  <title>Blood | Skripty</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=New+Rocker&family=Roboto:wght@300;400;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <!-- Relativní cesta (bez úvodního lomítka) pro bezproblémové lokální testování -->
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="./skripty.css" />
</head>

<body>
  <a href="../" class="back-btn"><i class="fa-solid fa-arrow-left" style="margin-right: 8px;"></i> Zpět na
    rozcestník</a>
  <a href="./tvoric/" class="next-btn"><i class="fa-solid fa-pen-nib" style="margin-right: 8px;"></i> Vytvořit
    Skript</a>

  <header>
    <div class="header-container">
      <div class="logo-wrapper">
        <h1 style="text-align: center; margin-bottom: 20px">
          Skripty
        </h1>
        <img src="../assets/img/community-logo2.png" alt="Community Logo" class="community-logo" />
      </div>
    </div>
  </header>

  <main>
    <div class="scripts-wrapper">
      <!-- Filtrační lišta nad skripty -->
      <div class="scripts-filter-bar">
        <div class="filter-top-row">
          <!-- Vyhledávání podle názvu skriptu -->
          <div class="filter-group search-input-group">
            <i class="fa-solid fa-scroll search-icon"></i>
            <input type="text" id="filter-name-input" placeholder="Hledat podle názvu..." autocomplete="off" />
            <button id="clear-name-btn" class="clear-search-btn" style="display:none;"
              title="Vymazat název">&times;</button>
          </div>

          <!-- Vyhledávání podle autora -->
          <div class="filter-group search-input-group">
            <i class="fa-solid fa-feather-pointed search-icon"></i>
            <input type="text" id="filter-author-input" placeholder="Hledat podle autora..." autocomplete="off" />
            <button id="clear-author-btn" class="clear-search-btn" style="display:none;"
              title="Vymazat autora">&times;</button>
          </div>

          <div class="filter-action-row">
            <!-- Tlačítko pro otevírání okna s postavami -->
            <button id="toggle-role-modal-btn" class="filter-btn primary-filter">
              <i class="fa-solid fa-users"></i> Vybrat postavy
              <span id="selected-roles-badge" class="filter-badge" style="display:none;">0</span>
            </button>

            <!-- Tlačítko pro přepínání zobrazení skriptů -->
            <button id="toggle-compact-scripts-btn" class="filter-btn toggle-compact-filter" title="Přepnout na kompaktní zobrazení">
              <i class="fa-solid fa-list-ul"></i> Kompaktní
            </button>

            <!-- Reset filtrů -->
            <button id="reset-filters-btn" class="filter-btn reset-filter" title="Vynulovat všechny filtry">
              <i class="fa-solid fa-rotate-left"></i> Reset
            </button>
          </div>
        </div>

        <!-- Obtížnosti ve 2 řádcích pod sebou s oboustrannými posuvníky -->
        <div class="filter-difficulty-section">
          <!-- Posuvník 1: Vypravěč -->
          <div class="difficulty-slider-item">
            <div class="slider-header">
              <span><i class="fa-solid fa-book-open-reader" style="color: #9b59b6;"></i> Obtížnost pro vypravěče:</span>
              <strong id="st-diff-val" class="slider-val-badge">1 - 5</strong>
            </div>
            <div class="dual-range-wrapper">
              <div class="dual-range-track"></div>
              <div class="dual-range-highlight" id="st-slider-highlight"></div>
              <input type="range" id="st-min-range" min="1" max="5" value="1" step="1" />
              <input type="range" id="st-max-range" min="1" max="5" value="5" step="1" />
            </div>
          </div>

          <!-- Posuvník 2: Hráč -->
          <div class="difficulty-slider-item">
            <div class="slider-header">
              <span><i class="fa-solid fa-gamepad" style="color: #9b59b6;"></i> Obtížnost pro hráče:</span>
              <strong id="pl-diff-val" class="slider-val-badge">1 - 5</strong>
            </div>
            <div class="dual-range-wrapper">
              <div class="dual-range-track"></div>
              <div class="dual-range-highlight" id="pl-slider-highlight"></div>
              <input type="range" id="pl-min-range" min="1" max="5" value="1" step="1" />
              <input type="range" id="pl-max-range" min="1" max="5" value="5" step="1" />
            </div>
          </div>
        </div>
      </div>

      <!-- Aktivní vybrané postavy (tagy) -->
      <div id="active-role-chips" class="active-chips-container" style="display:none;"></div>

      <div id="scripts-grid-container" class="scripts-grid">
        <div class="loading-spinner" style="grid-column: 1 / -1; text-align: center; color: #aaa; padding: 40px;">
          <i class="fa-solid fa-spinner fa-spin" style="font-size: 2.5rem; margin-bottom: 15px; color: #9b59b6;"></i>
          <p>Načítám dostupné skripty...</p>
        </div>
      </div>
    </div>

    <!-- Centrované okno pro výběr postav s přepínačem schopností -->
    <div id="role-filter-modal" class="role-modal-overlay">
      <div class="role-modal-container">
        <div class="role-modal-header">
          <h3><i class="fa-solid fa-users" style="color: #9b59b6;"></i> Vybrat postavy ve skriptu</h3>
          <button id="close-role-modal-btn" class="modal-close-btn" title="Zavřít">&times;</button>
        </div>

        <div class="role-modal-controls">
          <div class="modal-search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="modal-role-search" placeholder="Hledat postavu..." autocomplete="off" />
          </div>

          <div class="role-modal-categories">
            <button class="cat-filter-chip active" data-type="all"><i class="fa-solid fa-layer-group"></i> Vše</button>
            <button class="cat-filter-chip" data-type="townsfolk">Měšťané</button>
            <button class="cat-filter-chip" data-type="outsider">Outsideři</button>
            <button class="cat-filter-chip" data-type="minion">Přisluhovači</button>
            <button class="cat-filter-chip" data-type="demon">Démoni</button>
            <button class="cat-filter-chip" data-type="traveller">Cestovatelé</button>
            <button class="cat-filter-chip" data-type="fabled">Bájné</button>
            <button class="cat-filter-chip" data-type="loric">Loričtí</button>
          </div>

          <!-- Přepínač zobrazení schopností -->
          <label class="abilities-toggle-bar" for="toggle-show-abilities">
            <span class="toggle-switch">
              <input type="checkbox" id="toggle-show-abilities" />
              <span class="toggle-slider"></span>
            </span>
            <span class="toggle-label-text"><i class="fa-solid fa-book-open"></i> Zobrazovat schopnosti postav</span>
          </label>
        </div>

        <div id="modal-roles-list" class="modal-roles-scroll compact-view">
          <!-- Dynamicky vygenerované ikony/karty postav -->
        </div>

        <div class="role-modal-footer">
          <button id="clear-selected-roles-btn" class="drawer-secondary-btn"><i class="fa-solid fa-rotate-left"></i>
            Vymazat výběr</button>
          <button id="apply-role-modal-btn" class="drawer-primary-btn"><i class="fa-solid fa-check"></i> Zavřít</button>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>
      © Toto není oficiální obsah. Všechna práva ke hře patří The Pandemonium
      Institute.
    </p>
  </footer>

  <script src="./data/roles_data.js"></script>
  <script src="./scripts-list.js"></script>
</body>

</html>
