<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow">

    <title>🖋️ Tvorba Skriptu | Blood</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=New+Rocker&family=Roboto:wght@300;400;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

    <!-- Relativní cesty o úroveň výš do assets/css a lokálně k editoru -->
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="style-editor.css" />
</head>

<body>

    <!-- Tlačítko zpět na hlavní rozcestník -->
    <a href="../" class="back-btn"><i class="fa-solid fa-arrow-left" style="margin-right: 8px;"></i> Zpět</a>
    <!-- <header>
    <div class="header-container">
      <div class="logo-wrapper">
        <h1 style="text-align: center; margin-bottom: 20px">
          Tvořič Skriptu
        </h1>
        <img src="./../assets/img/community-logo2.png" alt="Community Logo" class="community-logo" />
      </div>
    </div>
  </header> -->

    <!-- Změna: Přidána třída "editor-main" pro zrušení 1000px limitu -->
    <main class="no-print editor-main">
        <div class="editor-layout">

            <!-- Změna: Přidána třída "sticky-panel" -->
            <aside class="editor-panel sticky-panel">

                <div class="mobile-drawer-header">
                    <h3><i class="fa-solid fa-users"></i> Výběr postav</h3>
                    <button id="close-chars-drawer-btn" class="drawer-close-btn" type="button">&times; Hotovo</button>
                </div>

                <div class="search-box">
                    <input type="text" id="search-char" placeholder="Hledat postavu..." autocomplete="off" />
                </div>

                <div class="role-modal-categories creator-categories" id="tvoric-category-filters">
                    <button type="button" class="cat-filter-chip active" data-type="all"><i class="fa-solid fa-layer-group"></i> Vše</button>
                    <button type="button" class="cat-filter-chip" data-type="townsfolk">Měšťané</button>
                    <button type="button" class="cat-filter-chip" data-type="outsider">Outsideři</button>
                    <button type="button" class="cat-filter-chip" data-type="minion">Přisluhovači</button>
                    <button type="button" class="cat-filter-chip" data-type="demon">Démoni</button>
                    <button type="button" class="cat-filter-chip" data-type="traveller">Cestovatelé</button>
                    <button type="button" class="cat-filter-chip" data-type="fabled">Legendy</button>
                </div>

                <!-- Přepínač zobrazení schopností postav -->
                <label class="abilities-toggle-bar sidebar-toggle" for="toggle-show-abilities-tvoric">
                    <span class="toggle-switch">
                        <input type="checkbox" id="toggle-show-abilities-tvoric" />
                        <span class="toggle-slider"></span>
                    </span>
                    <span class="toggle-label-text"><i class="fa-solid fa-book-open"></i> Zobrazovat schopnosti</span>
                </label>

                <div id="character-list-container" class="sidebar-char-list">
                    <!-- Dynamicky vykreslené postavy -->
                </div>
            </aside>

            <!-- PROSTŘEDNÍ SLOUPEC: Živý Editor -->
            <section class="editor-panel transparent-panel">
                <!-- HORNÍ AKČNÍ LIŠTA PRO MOBILY A MENTÁLNÍ NAVIGACI -->
                <div class="tvoric-top-toolbar">
                    <button id="mobile-toggle-chars-btn" class="tvoric-top-btn primary" type="button">
                        <i class="fa-solid fa-user-plus"></i> Výběr & Filtr postav
                    </button>
                    <button id="mobile-toggle-tools-btn" class="tvoric-top-btn secondary" type="button">
                        <i class="fa-solid fa-sliders"></i> Nástroje & Tisk
                    </button>
                </div>

                <div class="script-meta-inputs">
                    <input type="text" id="meta-title" placeholder="Název Skriptu" value="" />
                    <input type="text" id="meta-author" placeholder="Autor" value="" />
                </div>

                <div id="editor-roles-preview">
                    <!-- Zde se vykreslí role s plnými texty -->
                </div>
            </section>

            <!-- Plavoucí lišta varování (ve vzduchu) -->
            <div id="script-validation-bar" class="script-validation-bar"></div>

            <!-- PRAVÝ SLOUPEC: Možnosti & Tisk -->
            <aside class="editor-panel editor-settings sticky-panel">
                <div class="mobile-drawer-header">
                    <h3><i class="fa-solid fa-sliders"></i> Nástroje & Tisk</h3>
                    <button id="close-tools-drawer-btn" class="drawer-close-btn" type="button">&times; Zavřít</button>
                </div>

                <h2>Nástroje</h2>
                <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px;">
                    <button id="btn-clear" class="action-btn secondary"><i class="fa-solid fa-trash"></i> Smazat
                        Skript</button>
                    <button id="btn-share" class="action-btn secondary"><i class="fa-solid fa-link"></i> Sdílet
                        Odkaz</button>
                    <button id="btn-download-json" class="action-btn secondary">
                        <i class="fa-solid fa-file-arrow-down"></i> Stáhnout
                    </button>
                    <button id="btn-upload-json" class="action-btn secondary">
                        <i class="fa-solid fa-file-arrow-up"></i> Nahrát
                    </button>
                    <!-- Skrytý input pro výběr souboru -->
                    <input type="file" id="input-upload-json" accept=".json" style="display: none;" />
                </div>

                <h2 style="margin-top: 10px;">Tisk</h2>
                <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px;">
                    <label><input type="checkbox" id="chk-setup-table" checked /> Setup tabulka</label>
                    <label><input type="checkbox" id="chk-show-travellers" checked /> Cestovatelé & Legendy</label>
                    <label><input type="checkbox" id="chk-show-night" checked /> Pořadí v nocích</label>
                </div>

                <button id="btn-print" class="action-btn primary">
                    <i class="fa-solid fa-print"></i> Vytisknout (PDF)
                </button>
                <img src="./../../assets/img/community-logo2.png" alt="Community Logo"
                    style="margin-top: auto; max-width: 100%; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));" />
            </aside>
            <div class="section-nav">
                <button id="nav-up" title="Předchozí sekce"><i class="fa-solid fa-chevron-up"></i></button>
                <button id="nav-down" title="Následující sekce"><i class="fa-solid fa-chevron-down"></i></button>
            </div>

        </div>
    </main>

    <div id="mobile-drawer-backdrop" class="mobile-drawer-backdrop"></div>
    <!-- SKRYTÁ TISKOVÁ PLOCHA PRO A4 TISK (plní se dynamicky při kliknutí na tisk) -->
    <main id="print-area"></main>
    <!-- Správně nasměrovaná roles_data.js z data/ složky o úroveň výš -->
    <script src="./../data/roles_data.js"></script>
    <script src="script.js"></script>
</body>

</html>
